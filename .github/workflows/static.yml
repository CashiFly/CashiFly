    const cashiFeed = document.getElementById('cashiFeed');
    cashiFeed.innerHTML = galleryImages.map(src => `
      <div class="feed-item" data-src="${src}">
        <img src="${src}" alt="CashiGram фото" loading="lazy">
      </div>
    `).join('');

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    const lightboxDownload = document.getElementById('lightboxDownload');
    let currentImageIndex = 0;

    function openLightbox(index) {
      currentImageIndex = index;
      lightboxImg.src = galleryImages[index];
      lightbox.classList.add('active');
    }
    function closeLightbox() { lightbox.classList.remove('active'); }
    function nextImage() { currentImageIndex = (currentImageIndex + 1) % galleryImages.length; lightboxImg.src = galleryImages[currentImageIndex]; }
    function prevImage() { currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length; lightboxImg.src = galleryImages[currentImageIndex]; }
    function downloadImage() { window.open(galleryImages[currentImageIndex], '_blank'); }

    document.querySelectorAll('.feed-item').forEach((item, idx) => {
      item.addEventListener('click', () => openLightbox(idx));
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxNext.addEventListener('click', nextImage);
    lightboxPrev.addEventListener('click', prevImage);
    lightboxDownload.addEventListener('click', downloadImage);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

    let touchStartX = 0;
    lightbox.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    lightbox.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (diff > 50) prevImage();
      else if (diff < -50) nextImage();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });
  </script>
