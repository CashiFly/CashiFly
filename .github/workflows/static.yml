<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CashiFly · будущее звучит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeSpeed;
    }

    body::before {
      content: "";
      position: fixed;
      top: -20%; left: -20%; width: 140%; height: 140%;
      background: radial-gradient(circle at 25% 35%, rgba(255,220,240,0.8) 0%, transparent 40%),
                  radial-gradient(circle at 75% 65%, rgba(220,240,255,0.8) 0%, transparent 40%),
                  linear-gradient(145deg, rgba(255,255,255,0.98) 0%, rgba(250,250,255,0.95) 100%);
      background-size: 200% 200%;
      animation: bodyFlow 14s ease-in-out infinite alternate;
      z-index: -2;
      pointer-events: none;
      will-change: background-position;
      transform: translateZ(0);
    }
    @keyframes bodyFlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    .tabs {
      display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
      margin-bottom: 2rem; position: relative; z-index: 10;
    }
    .tab-btn {
      background: rgba(255,255,255,0.5); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.8); padding: 0.8rem 1.8rem;
      border-radius: 40px; font-weight: 600; font-size: 1rem; cursor: pointer;
      transition: 0.2s; color: #1a1f30;
      touch-action: manipulation;
    }
    .tab-btn.active { background: #1a1f30; color: white; }

    .tab-panel { display: none; width: 100%; }
    .tab-panel.active { display: block; }

    .hero-card {
      max-width: 700px; margin: 0 auto; background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 48px; padding: 2.5rem;
      border: 1px solid rgba(255,255,255,0.7); text-align: center;
    }
    .hero-card h1 {
      font-size: 4rem; font-weight: 800;
      background: linear-gradient(145deg, #0a0f1c, #232a40);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .carousel { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
    .carousel img {
      width: 100px; height: 100px; border-radius: 24px; object-fit: cover;
      transform: translateZ(0); backface-visibility: hidden;
    }

    .section-title {
      font-weight: 600; margin: 1.5rem 0 0.2rem;
      font-size: 1.4rem; color: #1a1f30; text-align: center;
    }

    .socials-box {
      background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 36px; padding: 1.5rem 2rem; margin-top: 0.8rem;
      border: 1px solid rgba(255,255,255,0.6);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 1.2rem;
    }
    .social-icon {
      display: flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.8); transition: 0.2s;
      touch-action: manipulation;
    }
    .social-icon svg { width: 60%; height: 60%; fill: #1a1f30; }
    .social-icon:hover { transform: scale(1.1); background: rgba(255,255,255,0.7); }

    .counter-card {
      max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 48px; padding: 2.5rem;
      border: 1px solid rgba(255,255,255,0.7); text-align: center;
    }

    .releases-wrapper {
      display: flex; flex-direction: column; gap: 2rem; max-width: 800px; margin: 0 auto; width: 100%;
    }
    .release-row {
      display: flex; gap: 1.2rem; align-items: stretch; width: 100%;
    }
    .release {
      flex: 1; border-radius: 40px; overflow: hidden; position: relative;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2); min-height: 140px;
      transform: translateZ(0);
    }
    .release-bg {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background-size: 400% 400%; animation: gradientShift 10s ease infinite alternate;
      z-index:0; will-change: background-position;
    }
    @keyframes gradientShift { 0%{background-position:0% 0%;} 100%{background-position:100% 100%;} }

    .floating-words { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:hidden; }
    .floating-word {
      position:absolute; white-space:nowrap; font-size:1.5rem; font-weight:700;
      opacity:0.3; background:rgba(255,255,255,0.2); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      padding:0.2rem 1rem; border-radius:30px; left:5%;
      animation:floatDown 9s linear infinite; will-change: transform;
    }
    .floating-word:nth-child(2) { left:65%; animation-delay:-3s; }
    .floating-word:nth-child(3) { left:35%; animation-delay:-6s; }
    @keyframes floatDown { 0%{top:-20%; transform:translateX(0);} 100%{top:110%; transform:translateX(30px);} }

    .release-content {
      position:relative; z-index:2; display:flex; align-items:center; gap:1.5rem;
      padding:1.8rem 2rem; background:rgba(0,0,0,0.15); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      border-radius:40px; height:100%;
    }
    .release-cover {
      width:100px; height:100px; border-radius:24px; overflow:hidden;
      border:2px solid rgba(255,255,255,0.5); flex-shrink:0;
      transform: translateZ(0);
    }
    .release-cover img { width:100%; height:100%; object-fit:cover; }
    .release-text { color:white; }
    .release-title { font-size:2rem; font-weight:800; }
    .release-artist { font-size:0.95rem; opacity:0.9; }
    .release-date { font-size:0.85rem; opacity:0.7; }
    .platforms-row { display:flex; gap:0.4rem; margin-top:0.5rem; }
    .plat-icon {
      display:flex; align-items:center; justify-content:center; width:34px; height:34px;
      background:rgba(255,255,255,0.2); border-radius:50%; font-size:0.75rem;
      color:white; text-decoration:none; touch-action:manipulation;
    }

    .info-squares { display: flex; flex-direction: column; gap: 0.8rem; width: 130px; flex-shrink: 0; }
    .info-square {
      flex: 1; background: rgba(255,255,255,0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 28px; border: 1px solid rgba(255,255,255,0.7);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.3rem; cursor: pointer; transition: 0.2s; font-weight: 600; color: #1a1f30;
      box-shadow: 0 10px 20px -8px rgba(0,0,0,0.08); touch-action: manipulation;
    }
    .info-square:hover { background: rgba(255,255,255,0.6); transform: translateY(-2px); }
    .info-square div:first-child { font-size: 1.8rem; }

    .modal {
      position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);
      display:flex; align-items:center; justify-content:center; z-index:100;
      visibility:hidden; opacity:0; transition:0.3s;
    }
    .modal.active { visibility:visible; opacity:1; }
    .modal-content {
      max-width:600px; width:90%; max-height:80vh; overflow-y:auto; border-radius:40px;
      padding:2.5rem; border:1px solid rgba(255,255,255,0.3);
      position:relative; color:white; background-size:400% 400%;
      animation: gradientShift 10s ease infinite alternate;
      will-change: background-position;
    }
    .modal .close {
      position: sticky; top: 10px; float: right; font-size: 2rem; cursor: pointer;
      z-index: 5; background: rgba(0,0,0,0.4); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      margin-bottom: -40px; margin-right: -10px;
    }
    .modal-text {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 24px; padding: 2rem; white-space: pre-wrap; line-height: 1.7;
      font-size: 1rem; word-wrap: break-word;
    }

    .modal.pink .modal-content { background: linear-gradient(145deg, #ff4d4d, #cc3333, #ff6666, #cc2929); }
    .modal.clean .modal-content { background: linear-gradient(145deg, #111, #1a1a1a, #0d0d0d, #1f1f1f); }
    .modal.clean .modal-text { color: #b0ff90; }
    .modal.mommy .modal-content { background: linear-gradient(145deg, #1a3b1a, #2d5a2d, #0f2b0f, #3b693b); }
    .modal.sarcasm .modal-content { background: linear-gradient(145deg, #cc3333, #ff4d4d, #cc2929, #ff6666); }
    .modal.fly .modal-content { background: linear-gradient(145deg, #ff8c42, #ff6b2b, #ffb347, #ff9f55); }

    .pink .release-bg { background:linear-gradient(125deg, #ff4d4d, #cc3333, #ff6666); }
    .clean .release-bg { background:linear-gradient(125deg, #111, #1a1a1a); }
    .clean .release-text { color:#b0ff90; }
    .mommy .release-bg { background:linear-gradient(125deg, #1a3b1a, #2d5a2d); }
    .sarcasm .release-bg { background:linear-gradient(125deg, #cc3333, #ff4d4d, #cc2929); }
    .fly .release-bg { background:linear-gradient(125deg, #ff8c42, #ff6b2b); }

    .cashi-feed {
      max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; width: 100%;
    }
    .feed-item {
      background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 36px; overflow: hidden; box-shadow: 0 15px 25px -10px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.7); cursor: pointer; transition: transform 0.2s;
      transform: translateZ(0); touch-action: manipulation;
    }
    .feed-item:hover { transform: scale(1.02); }
    .feed-item img { width: 100%; height: auto; display: block; object-fit: cover; }

    .lightbox {
      position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9);
      display:flex; align-items:center; justify-content:center; z-index:200;
      visibility:hidden; opacity:0; transition:0.3s;
    }
    .lightbox.active { visibility:visible; opacity:1; }
    .lightbox-content {
      position:relative; max-width:90%; max-height:90%;
      display:flex; align-items:center; justify-content:center;
    }
    .lightbox-img {
      max-width:100%; max-height:80vh; border-radius:24px;
      box-shadow:0 30px 50px rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.2);
    }
    .lightbox-close, .lightbox-nav, .lightbox-download {
      position:absolute; color:white; background:rgba(0,0,0,0.5);
      border:none; border-radius:50%; width:48px; height:48px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:24px; transition:0.2s; z-index:10;
      touch-action: manipulation;
    }
    .lightbox-close:hover, .lightbox-nav:hover, .lightbox-download:hover { background:rgba(255,255,255,0.2); }
    .lightbox-close { top:20px; right:20px; }
    .lightbox-nav.prev { left:20px; top:50%; transform:translateY(-50%); }
    .lightbox-nav.next { right:20px; top:50%; transform:translateY(-50%); }
    .lightbox-download { bottom:20px; right:20px; }
    .lightbox-close::before { content:"✕"; }
    .lightbox-nav.prev::before { content:"‹"; font-size:36px; }
    .lightbox-nav.next::before { content:"›"; font-size:36px; }
    .lightbox-download::before { content:"⬇"; }

    .news-card {
      max-width:500px; margin:0 auto; background:rgba(255,255,255,0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius:48px; padding:3rem; text-align:center;
    }

    @media (max-width:650px) {
      body { padding: 1.5rem 0.8rem; }
      .release-row { flex-direction: column; }
      .info-squares { flex-direction: row; width:100%; height:90px; }
      .cashi-feed { max-width: 100%; }
      .hero-card h1 { font-size: 3rem; }
      .release-title { font-size: 1.5rem; }
      .modal-content { padding: 1.5rem; }
      .tabs { gap: 0.3rem; }
      .tab-btn { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
