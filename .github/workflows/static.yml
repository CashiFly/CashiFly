    const container = document.getElementById('releasesContainer');
    container.innerHTML = releasesData.map(r => `
      <div class="release-row">
        <div class="release ${r.color}">
          <div class="floating-words">
            <div class="floating-word">${r.word}</div><div class="floating-word">${r.word}</div><div class="floating-word">${r.word}</div>
          </div>
          <div class="release-bg"></div>
          <div class="release-content">
            <div class="release-cover"><img src="${r.cover}" alt="${r.title}" loading="lazy"></div>
            <div class="release-text">
              <div class="release-title">${r.title}</div>
              <div class="release-artist">${r.artist}</div>
              <div class="release-date">${r.date}</div>
              <div class="platforms-row">${r.platforms.map(p=>`<a href="${p.u}" target="_blank" class="plat-icon">${p.n}</a>`).join('')}</div>
            </div>
          </div>
        </div>
        <div class="info-squares">
          <div class="info-square" data-action="info" data-id="${r.id}"><div>i</div>Инфо</div>
          <div class="info-square" data-action="lyrics" data-id="${r.id}"><div>T</div>Текст</div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.info-square').forEach(sq => {
      sq.addEventListener('click', () => {
        const id = sq.dataset.id;
        const action = sq.dataset.action;
        const rel = releasesData.find(r => r.id === id);
        const text = action === 'info' ? rel.info : rel.lyrics;
        showModal(rel.color, text);
      });
    });

    function showModal(colorClass, text) {
      const modal = document.createElement('div');
      modal.className = `modal active ${colorClass}`;
      modal.innerHTML = `<div class="modal-content"><span class="close">&times;</span><div class="modal-text">${text}</div></div>`;
      document.body.appendChild(modal);
      modal.querySelector('.close').addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      modal.querySelector('.modal-content').scrollTop = 0;
    }

